<style>

  @media (prefers-color-scheme: dark){ :root{ --bg:#12161c; --panel:#1a2029; --ink:#e8ecf2; --muted:#9aa4b4; --line:#2a323e; --accent:#8db4e8; --sea:#222a35; } }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex}
  aside{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
  header{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
  header h1{font-size:17px;margin:0 0 10px;font-weight:650;letter-spacing:-.01em}
  .tabs{display:flex;gap:6px}
  .tab{flex:1;font:inherit;font-size:13px;font-weight:600;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #sub{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
  #reset{margin:10px 18px 0;display:none;font:inherit;font-size:12.5px;background:none;border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:8px;cursor:pointer;align-self:flex-start}
  #reset.show{display:block}
  #list{overflow:auto;flex:1;padding:8px 10px 16px}
  .item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:inherit;font:inherit}
  .item:hover{background:var(--bg)}
  .item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .item.active{background:var(--bg);border-color:var(--line)}
  .badge{flex:none;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:12.5px;display:grid;place-items:center;margin-top:1px}
  .item b{display:block;font-size:13.5px;font-weight:600}
  .item .cities{display:block;font-size:12.5px;color:var(--muted)}
  .item .qtd{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .detail{display:none;margin-top:8px;font-size:12px;line-height:1.5;color:var(--muted);max-height:150px;overflow:auto;border-top:1px solid var(--line);padding-top:6px}
  .item.active .detail{display:block}
  #map{flex:1;height:100%;background:var(--sea)}
  .pin{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:700;font-size:11.5px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .ctx{color:#5b6575;font-size:10.5px;font-weight:600;text-shadow:0 0 3px #fff,0 0 3px #fff;white-space:nowrap;transform:translate(-50%,-50%)}
  .lbl{position:absolute;transform:translate(-50%,15px);white-space:nowrap;font-size:11px;font-weight:700;color:#1c2430;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;pointer-events:none}
  .ctxd{font-size:10px;font-weight:600;color:#5b6575}
  .z-low .lbl{display:none}
  .z-mid .ctxd{display:none}
  .note{padding:10px 18px 14px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);line-height:1.45}
  @media (max-width:760px){
    body{flex-direction:column-reverse}
    aside{width:100%;height:46%;border-right:0;border-top:1px solid var(--line)}
    #map{height:54%}
  }
</style>

  note.textContent = NOTES[op];

  const used = new Set();
  cl.forEach(c=>{(c.d||[]).forEach(x=>used.add('D'+x));(c.m||[]).forEach(x=>used.add('M'+x));});
  Object.entries(GEO.D).forEach(([k,v])=>{ if(!used.has('D'+k)) L.polygon(v.polys,ctxStyle).bindTooltip(pretty(k)).addTo(ctxLayer); label(v.c,pretty(k),'ctxd').addTo(ctxLayer); });
  Object.entries(GEO.M).forEach(([k,v])=>{ if(!used.has('M'+k)){
    L.polygon(v.polys,{...ctxStyle,weight:1.5,fillOpacity:.25}).bindTooltip(v.name).addTo(ctxLayer);
    L.marker(v.c,{icon:L.divIcon({className:'',html:`<div class="ctx">${v.name}</div>`,iconSize:[0,0]}),interactive:false,keyboard:false}).addTo(ctxLayer);} });

  // dono de cada área: o primeiro cluster que a lista sem marcá-la como secundária
  const owner = {};
  cl.forEach(c=>{
    (c.d||[]).forEach(k=>{ if(!(c.dashed_d||[]).includes(k) && owner['D'+k]===undefined) owner['D'+k]=c.id; });
    (c.m||[]).forEach(k=>{ if(owner['M'+k]===undefined) owner['M'+k]=c.id; });
  });
  cl.forEach(c=>{
    const g = L.featureGroup();
    const pins = [];
    const poly = (key,label,item)=>{
      const label2 = (pos,txt)=>L.marker(pos,{icon:L.divIcon({className:'',html:`<div class="lbl">${txt}</div>`,iconSize:[0,0]}),interactive:false,keyboard:false});
      const shared = owner[key] !== c.id;
      const style = shared ? {color:c.color,weight:3,dashArray:'7 5',fill:false}
                           : {color:c.color,weight:2,fillColor:c.color,fillOpacity:.45};
      const tip = shared ? `<b>Cluster ${c.id}</b> (também no cluster ${owner[key]})<br>${label}` : `<b>Cluster ${c.id}</b><br>${label}`;
      L.polygon(item.polys,style).bindTooltip(tip,{sticky:true}).addTo(g);
      if(!shared){ pins.push([item.c,label]); label2(item.c,label).addTo(g); }
    };
    (c.d||[]).forEach(k=>poly('D'+k,pretty(k),GEO.D[k]));
    (c.m||[]).forEach(k=>poly('M'+k,GEO.M[k].name,GEO.M[k]));
    (c.circles||[]).forEach(([nome,lat,lng,r])=>{
      L.circle([lat,lng],{radius:r,color:c.color,weight:c.dashed?2.5:2,dashArray:c.dashed?'7 5':null,fillColor:c.color,fillOpacity:c.dashed?.18:.45})
        .bindTooltip(`<b>Cluster ${c.id}</b><br>${nome}`,{sticky:true}).addTo(g);
      pins.push([[lat,lng],nome]);
      label([lat,lng],nome).addTo(g);
    });
    pins.forEach(([pos,label])=>{
      L.marker(pos,{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${c.color}">${c.id}</div>`,iconSize:[26,26],iconAnchor:[13,13]}),keyboard:false})
        .bindTooltip(`<b>Cluster ${c.id}</b><br>${label}`,{direction:'top',offset:[0,-10]}).addTo(g);
    });
    g.addTo(map);
    groups[c.id]=g;

    const b = document.createElement('button');
    b.className='item'; b.type='button'; b.setAttribute('role','listitem'); b.dataset.id=c.id;
    b.innerHTML = `<div class="badge" style="background:${c.color}">${c.id}</div>
      <div style="min-width:0"><b>${c.region}</b><span class="cities">${c.cities}</span><span class="qtd">${c.qtd} ${c.qtd===1?'bairro ativo':'bairros ativos'}</span>
      <div class="detail">${c.bairros.join(', ')}</div></div>`;
    b.addEventListener('click',()=> select(selected===c.id?null:c.id));
    list.appendChild(b);
  });

  home = L.featureGroup(Object.values(groups)).getBounds().pad(0.06);
  map.fitBounds(home);
  updateLabels();
}

function select(id){
  selected = id;
  document.querySelectorAll('.item').forEach(i=>i.classList.toggle('active', Number(i.dataset.id)===id));
  resetBtn.classList.toggle('show', id!==null);
  OPS[currentOp].clusters.forEach(c=>{
    const show = id===null || c.id===id;
    if(show && !map.hasLayer(groups[c.id])) groups[c.id].addTo(map);
    if(!show && map.hasLayer(groups[c.id])) map.removeLayer(groups[c.id]);
  });
  if(id===null){ map.flyToBounds(home,{duration:.6}); }
  else { map.flyToBounds(groups[id].getBounds().pad(0.35),{duration:.6,maxZoom:14}); }
  if(id!==null){ const el=document.querySelector(`.item[data-id="${id}"]`); if(el) el.scrollIntoView({block:'nearest'}); }
}

function updateLabels(){
  const z = map.getZoom(), el = map.getContainer();
  el.classList.toggle('z-low', z < 9);
  el.classList.toggle('z-mid', z < 12);
}
map.on('zoomend', updateLabels);
resetBtn.addEventListener('click',()=>select(null));
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>render(t.dataset.op)));
render('BRXSP18');
</script>
</body>
</html>
